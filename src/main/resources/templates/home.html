<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>

    <div th:insert="~{index :: navbar}"></div>

    <div th:if="${param.notAuthorized}">
        <div class="alert alert-danger">
            Not authorized!
        </div>
    </div>

    <!-- Blocco per mostrare il messaggio di avvenuta registrazione -->
    <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
    </div>

    <!-- Blocco per mostrare il messaggio di errore della richiesta carriera -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <div class="container-fluid">
        <div class="row min-vh-100 align-items-center">
            <div class="col-10">
                <h1 class="mb-5">Welcome to <span class="display-4 fw-bold d-block">New Aulab Chronicle</span></h1>
            </div>
        </div>
    </div>

    <!-- Sezione per visualizzare gli ultimi articoli del controller -->
    <div class="container my-5">
        <h2 class="section-title mb-4">Ultimi articoli</h2>
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4" th:each="article : ${articles}">
                <article class="card article-card h-100">
                    <!-- Controllo immagine -->
                    <img th:if="${article.image != null and article.image.path != ''}" th:src="${article.image.path}"
                        class="card-img-top article-card__image" alt="Immagine articolo" />
                    <img th:unless="${article.image != null and article.image.path != ''}"
                        th:src="@{/images/default.jpg}" class="card-img-top article-card__image" alt="Immagine di default" />

                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title article-card__title" th:text="${article.title}">Titolo</h5>
                        <h6 class="card-subtitle article-card__subtitle mb-2" th:text="${article.subtitle}">Sottotitolo</h6>
                        <p class="card-text article-card__excerpt" th:text="${article.body}">Contenuto breve dell'articolo...
                        </p>

                        <div class="mt-auto">
                            <hr>
                            <p class="article-card__meta small mb-2">
                                Redatto il <span th:text="${article.publishDate}">data</span> da
                                <span class="fw-bold" th:text="${article.user.username}">User</span>
                            </p>
                            <!-- Bottone per andare al dettaglio dell'articolo -->
                            <a th:href="@{/articles/detail/{id}(id=${article.id})}"
                                class="btn btn-primary article-card__button w-100">Leggi di più</a>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </div>

    <div th:insert="~{index :: footer}"></div>
    <script th:replace="~{index :: bootstrapScript}"></script>

</body>

</html>
