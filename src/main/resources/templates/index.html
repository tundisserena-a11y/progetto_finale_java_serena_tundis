<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Aulab Chronicle</title>
</head>

<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">Aulab Chronicle</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- rotta link creazione articolo visibile solo a utenti loggati -->
                    <li sec:authorize="isAuthenticated()" class="nav-item">
                        <a class="nav-link" th:href="@{/articles/create}">Crea articolo</a>
                    </li>
                    <!-- Nuovo link per visualizzare l'indice di tutti gli articoli -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/articles}">Tutti gli articoli</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Accesso
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li sec:authorize="isAnonymous()"><a class="dropdown-item" aria-current="page"
                                    th:href="@{/register}">Register</a></li>
                            <li sec:authorize="isAnonymous()"><a class="dropdown-item" aria-current="page"
                                    th:href="@{/login}">Login</a></li>
                            <li sec:authorize="isAuthenticated()"><a class="dropdown-item" aria-current="page"
                                    th:href="@{/logout}">Logout</a></li>
                        </ul>
                    </li>
                </ul>
                <div sec:authorize="isAuthenticated()"
                    th:text="'Benvenuto: ' + ${#authentication.principal.fullname} + ' - ' + ${#authentication.principal.authorities[0].authority.replace('ROLE_', '')}">
                    Benvenuto</div>
            </div>
        </div>
    </nav>

    <!-- Per risolvere l'errore 500 -->
    <footer th:fragment="footer" class="bg-light text-center text-lg-start mt-auto py-3">
        <div class="text-center p-3">
            © 2026 Aulab Chronicle
        </div>
    </footer>

</body>

<script th:fragment="bootstrapScript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

</html>
