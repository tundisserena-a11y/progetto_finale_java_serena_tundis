<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>

    <nav th:insert="~{index :: navbar}"></nav>

    <div class="min-vh-100">
        <div th:if="${successMessage}" class="alert alert-success">
            <p th:text="${successMessage}"></p>
        </div>

        <div class="container">
            <div class="row justify-content-center mb-5">
                <div class="col-10 mb-5">
                    <h1 class="text-center" th:text="${title}">Index articoli</h1>
                </div>
            </div>
        </div>

        <div class="container" th:if="${articles.size() > 0}">
            <div class="row g-4 mb-5">
                <div th:each="article : ${articles}" class="col-12 col-md-6 col-lg-4 d-flex">
                    <article class="card article-card h-100 w-100">
                        <img th:if="${article.image != null and article.image.path != ''}" th:src="${article.image.path}"
                            class="card-img-top article-card__image"
                            alt="Immagine articolo" />
                        <img th:unless="${article.image != null and article.image.path != ''}" th:src="@{/images/default.jpg}"
                            class="card-img-top article-card__image" alt="Immagine di default" />

                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title article-card__title" th:text="${article.title}"></h5>
                            <p class="card-text article-card__subtitle" th:text="${article.subtitle}"></p>
                            <p class="article-card__meta mb-3" th:text="${article.user.username}"></p>

                            <a th:href="@{/articles/detail/{id}(id=${article.id})}" class="btn btn-primary article-card__button mt-auto">Leggi l'articolo</a>
                        </div>
                    </article>
                </div>
            </div>
        </div>

        <div class="row justify-content-center vh-100" th:unless="${articles.size() > 0}">
            <div class="col-10 mb-5">
                <h1 class="text-center">NESSUN ARTICOLO PRESENTE</h1>
            </div>
        </div>

    </div>

    <div th:insert="~{index :: footer}"></div>
    <script th:replace="~{index :: bootstrapScript}"></script>

</body>

</html>
